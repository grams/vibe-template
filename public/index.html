<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon app</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/vibe-kit.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <p id="loading" class="muted">Chargement…</p>

    <!-- Écran de connexion -->
    <section id="login" class="card" hidden>
      <h1>Mon app</h1>
      <p class="muted">Connectez-vous pour continuer.</p>

      <button id="google" class="btn btn-google" type="button" hidden>
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        Continuer avec Google
      </button>
      <p id="or" class="divider" hidden><span>ou</span></p>

      <form id="magic">
        <label for="email">Recevoir un lien par email</label>
        <input id="email" type="email" required placeholder="vous@exemple.fr" autocomplete="email">
        <button class="btn btn-primary" type="submit">Envoyer le lien</button>
      </form>
      <p id="login-msg" class="msg" role="status"></p>
    </section>

    <!-- Application (exemple : notes) -->
    <section id="app" hidden>
      <header class="topbar">
        <h1>Mes notes</h1>
        <div class="who">
          <span id="user-email" class="muted"></span>
          <button id="logout" class="btn btn-ghost" type="button">Déconnexion</button>
        </div>
      </header>

      <form id="note-form" class="card row">
        <input id="note-text" type="text" required maxlength="2000" placeholder="Nouvelle note…" aria-label="Nouvelle note">
        <button class="btn btn-primary" type="submit">Ajouter</button>
      </form>
      <p id="app-msg" class="msg" role="status"></p>
      <ul id="notes" class="notes"></ul>
      <p id="empty" class="muted" hidden>Aucune note pour l'instant.</p>
    </section>
  </main>
</body>
</html>
